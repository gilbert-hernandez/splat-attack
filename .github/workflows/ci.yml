# Runs the same commands you run locally: npm ci, check, build and e2e.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Format check, lint, typecheck, unit tests (stops at the first failure).
      - run: npm run check

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run e2e

      - name: Upload Playwright report and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
